# Private cava instance used by umbriel-audio-bridge.
# 64 mono bars, ASCII raw output on stdout, 30 frames per second.
#
# method = pulse works on PulseAudio and on PipeWire through pipewire-pulse.
# On a PipeWire-only setup you can switch to the native backend:
#   method = pipewire
[general]
framerate = 30
bars = 64
autosens = 0
sensitivity = 250
lower_cutoff_freq = 40
higher_cutoff_freq = 16000
sleep_timer = 0

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
channels = mono
mono_option = average
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 20
integral = 80
gravity = 90
ignore = 2
monstercat = 1.5
